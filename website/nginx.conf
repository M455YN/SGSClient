server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Studio page: everything is self-hosted, so the policy can be strict (no inline scripts or styles).
    set $csp_site "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    # Docs (Zensical) need a few inline scripts and a search worker.
    set $csp_docs "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    error_page 404 /404.html;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp_site always;
        try_files $uri $uri/ =404;
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp_docs always;
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /docs/404.html;
    }

    # Fonts and images rarely change; CSS/JS have no hashed names, so they get a short cache.
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
    }

    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp_site always;
        expires 1h;
    }
}
