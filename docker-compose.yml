# OVH Portainer: sgs-api behind existing Nginx Proxy Manager.
# NPM container `npm` already sits on external networks `frontend` + `backend`.
# Attach the API to `frontend` so NPM can resolve http://sgs-api:8080.

services:
  sgs-api:
    image: ${SGS_API_IMAGE:-sgsclient-api:local}
    build:
      context: .
      dockerfile: src/Apps/SGSClient.Api/Dockerfile
    container_name: sgs-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__SgsDatabase: ${SGS_SQL_CONNECTION}
      ConnectionStrings__RofwDatabase: ${SGS_ROFW_SQL_CONNECTION:-}
      ConnectionStrings__ReportingoDatabase: ${SGS_REPORTINGO_SQL_CONNECTION:-}
      Games__StoragePath: /data/sgs/games
      Games__PublicBaseUrl: /api/games/packages
      Games__MediaPublicBaseUrl: /api/games/media
      Games__RetentionCount: ${SGS_RETENTION_COUNT:-3}
      # true = only game downloads work; super admins keep full access.
      Maintenance__Enabled: ${SGS_MAINTENANCE_ENABLED:-false}
      AzureAd__Enabled: ${SGS_AZUREAD_ENABLED:-true}
      AzureAd__ClientId: ${SGS_AZUREAD_CLIENT_ID:-}
      AzureAd__TenantName: ${SGS_AZUREAD_TENANT:-}
      AzureAd__SigninPolicy: ${SGS_AZUREAD_SIGNIN_POLICY:-B2C_1_SGSClient_SignInUp}
      AzureAd__PasswordResetPolicy: ${SGS_AZUREAD_PASSWORD_RESET_POLICY:-B2C_1_SGSClient_PassRESET}
      AzureAd__ApiAudience: ${SGS_AZUREAD_API_AUDIENCE:-}
      # 32+ random chars. Signs achievement tokens handed to running games; empty = random per start.
      Achievements__SigningKey: ${SGS_ACHIEVEMENTS_SIGNING_KEY:-}
    volumes:
      - ${SGS_GAMES_VOLUME:-sgs_games}:/data/sgs/games
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend
    restart: unless-stopped

  # Studio website + docs. In NPM: sgs.m455yn.io -> http://sgs-web:80
  sgs-web:
    image: ${SGS_WEB_IMAGE:-sgs-website:local}
    build:
      context: .
      dockerfile: website/Dockerfile
    container_name: sgs-web
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    external: true
    name: frontend

volumes:
  sgs_games:
