name: API container image

on:
  push:
    branches: [master, main]
    paths:
      - "src/Apps/SGSClient.Api/**"
      - "src/Core/SGSClient.Core/**"
      - "src/Infrastructure/SGSClient.Infrastructure.Server/**"
      - "Directory.Build.props"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/m455yn/sgsclient-api

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Apps/SGSClient.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
