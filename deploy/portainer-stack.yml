# Portainer → Stacks → Add stack → Web editor.
# Image comes from GHCR (build locally or via GitHub Actions), not from the VPS.
#
#   SGS_API_IMAGE=ghcr.io/m455yn/sgsclient-api:latest
#   SGS_SQL_CONNECTION=Data Source=host.docker.internal;Initial Catalog=...;User ID=...;Password=...;Encrypt=True;TrustServerCertificate=True
#
# Private package: Portainer → Registries → Add GitHub (user + PAT with read:packages).
# Then Recreate the container with "Pull latest image".
#
# Networks `frontend` must already exist (NPM stack).

services:
  sgs-api:
    image: ${SGS_API_IMAGE:-ghcr.io/m455yn/sgsclient-api:latest}
    pull_policy: always
    container_name: sgs-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__SgsDatabase: ${SGS_SQL_CONNECTION}
      Games__StoragePath: /data/sgs/games
      Games__PublicBaseUrl: /api/games/packages
      Games__MediaPublicBaseUrl: /api/games/media
      Games__RetentionCount: ${SGS_RETENTION_COUNT:-3}
      AzureAd__Enabled: ${SGS_AZUREAD_ENABLED:-false}
      AzureAd__ClientId: ${SGS_AZUREAD_CLIENT_ID:-}
      AzureAd__TenantName: ${SGS_AZUREAD_TENANT:-}
      AzureAd__SigninPolicy: ${SGS_AZUREAD_SIGNIN_POLICY:-B2C_1_SGSClient_SignInUp}
      AzureAd__PasswordResetPolicy: ${SGS_AZUREAD_PASSWORD_RESET_POLICY:-B2C_1_SGSClient_PassRESET}
      AzureAd__ApiAudience: ${SGS_AZUREAD_API_AUDIENCE:-}
    volumes:
      - ${SGS_GAMES_VOLUME:-sgs_games}:/data/sgs/games
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  frontend:
    external: true
    name: frontend

volumes:
  sgs_games:
